<!DOCTYPE html>
<html>
<head>

    <title>Vehicle Maintenance Log</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        nav {
            background: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .button {
            display: inline-block;
            padding: 8px 15px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .delete {
            background: #dc3545;
        }

        .success {
            background: #d4edda;
            padding: 15px;
            margin-bottom: 20px;
        }

        .warning {
            background: #fff3cd;
            padding: 15px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

    </style>

</head>

<body>

<nav>

    <a href="{% url 'home' %}">
        Home
    </a>

    <a href="{% url 'maintenance_list' %}">
        Maintenance Records
    </a>

    <a href="{% url 'maintenance_create' %}">
        Add Maintenance
    </a>

    <a href="{% url 'cost_summary' %}">
        Cost Summary
    </a>

</nav>


<div class="container">

    {% block content %}

    {% endblock %}

</div>

</body>
</html>
