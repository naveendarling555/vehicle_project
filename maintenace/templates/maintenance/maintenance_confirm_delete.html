{% extends 'maintenance/base.html' %}


{% block content %}

<h1>Delete Maintenance Record</h1>


<div class="card">

    <p>
        Are you sure you want to delete this record?
    </p>

    <p>

        <strong>
            {{ record.vehicle.vehicle_number }}
        </strong>

        -

        {{ record.service_type }}

    </p>


    <form method="POST">

        {% csrf_token %}

        <button
            class="button delete"
            type="submit"
        >
            Yes, Delete
        </button>

        <a
            class="button"
            href="{% url 'maintenance_detail' record.id %}"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
